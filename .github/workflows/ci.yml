name: CI (Phase 0)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:up
      - run: npm run db:verify  # asserts Redis noeviction + Postgres healthy
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit under TZ matrix
        run: |
          TZ=UTC npm run test:unit
          TZ=Asia/Kolkata npm run test:unit
          TZ=America/Los_Angeles npm run test:unit
      - run: npm run build
